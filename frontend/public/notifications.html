<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheFinalVerdict - Notifiche</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; background: #f5f5f5; }
        
        .header { background: linear-gradient(to bottom, #ffa726 0%, #fb8c00 100%); border-bottom: 3px solid #f57c00; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: bold; color: #fff; text-decoration: none; }
        .logo-icon { width: 30px; height: 30px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .header-right a { color: #fff; text-decoration: none; padding: 4px 12px; background: rgba(255,255,255,0.2); border-radius: 3px; margin-left: 10px; font-size: 12px; }
        
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        
        .page-header { background: #fff; border: 1px solid #d3d3d3; padding: 15px 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-radius: 3px; }
        .page-title { font-size: 18px; color: #333; font-weight: bold; }
        
        .btn { padding: 6px 12px; border: 1px solid #999; background: #e0e0e0; cursor: pointer; font-size: 12px; border-radius: 2px; }
        .btn:hover { background: #d0d0d0; }
        .btn-primary { background: #f57c00; color: #fff; border-color: #e65100; }
        
        .notif-list { background: #fff; border: 1px solid #d3d3d3; border-radius: 3px; overflow: hidden; }
        .notif-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; gap: 15px; cursor: pointer; }
        .notif-item:hover { background: #fff3e0; }
        .notif-item.unread { background: #fff8e1; border-left: 3px solid #f57c00; }
        .notif-icon { width: 40px; height: 40px; border-radius: 50%; background: #f57c00; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .notif-content { flex: 1; }
        .notif-title { font-weight: bold; color: #333; margin-bottom: 5px; }
        .notif-message { color: #555; font-size: 12px; line-height: 1.4; }
        .notif-time { font-size: 11px; color: #999; margin-top: 5px; }
        
        .empty { padding: 40px; text-align: center; color: #666; }
        
        .footer { background: #4682b4; color: #fff; padding: 10px; text-align: center; font-size: 11px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="dashboard.html" class="logo">
            <div class="logo-icon">⚖️</div>
            <span>TheFinalVerdict</span>
        </a>
        <div class="header-right">
            <a href="dashboard.html">Dashboard</a>
            <a href="messages.html">Messaggi</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <div class="page-title">🔔 Notifiche</div>
            <button class="btn btn-primary" onclick="markAllRead()">Segna tutte come lette</button>
        </div>
        <div class="notif-list" id="notifList">
            <div class="empty">Caricamento...</div>
        </div>
    </div>

    <div class="footer">TheFinalVerdict © 2026</div>

    <script>
        const token = localStorage.getItem('accessToken');
        if (!token) window.location.href = 'login.html';

        async function loadNotifications() {
            try {
                const response = await fetch('/api/v1/notifications', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await response.json();
                const list = document.getElementById('notifList');
                
                if (data.notifications.length === 0) {
                    list.innerHTML = '<div class="empty">Nessuna notifica</div>';
                    return;
                }

                list.innerHTML = data.notifications.map(n => `
                    <div class="notif-item ${!n.is_read ? 'unread' : ''}" onclick="markRead('${n.id}')">
                        <div class="notif-icon">${n.type === 'friend_request' ? '' : n.type === 'ticket_reply' ? '🎫' : n.type === 'comment' ? '💬' : '🔔'}</div>
                        <div class="notif-content">
                            <div class="notif-title">${n.title}</div>
                            <div class="notif-message">${n.message}</div>
                            <div class="notif-time">${new Date(n.created_at).toLocaleString()}</div>
                        </div>
                    </div>
                `).join('');
            } catch (error) { console.error(error); }
        }

        async function markRead(id) {
            try {
                await fetch(`/api/v1/notifications/${id}/read`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${token}` } });
                loadNotifications();
            } catch (error) { console.error(error); }
        }

        async function markAllRead() {
            try {
                await fetch('/api/v1/notifications/mark-all-read', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
                loadNotifications();
            } catch (error) { console.error(error); }
        }

        function logout() {
            if (confirm('Sei sicuro di voler uscire?')) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }

        loadNotifications();
    </script>
</body>
</html>
