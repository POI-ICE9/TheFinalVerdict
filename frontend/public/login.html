<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheFinalVerdict - Accedi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; background: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; }
        
        .header { background: linear-gradient(to bottom, #ffa726 0%, #fb8c00 100%); border-bottom: 3px solid #f57c00; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: bold; color: #fff; text-decoration: none; }
        .logo-icon { width: 30px; height: 30px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .header-right a { color: #fff; text-decoration: none; padding: 4px 15px; background: rgba(255,255,255,0.2); border-radius: 3px; }
        .header-right a:hover { background: rgba(255,255,255,0.3); }
        
        .login-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .login-box { background: #fff; border: 1px solid #d3d3d3; border-radius: 3px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .login-box h2 { color: #e65100; margin-bottom: 20px; text-align: center; font-size: 22px; }
        
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; font-size: 12px; }
        .form-input { width: 100%; padding: 8px 12px; border: 1px solid #999; border-radius: 3px; font-size: 13px; font-family: Arial, sans-serif; }
        .form-input:focus { outline: none; border-color: #f57c00; }
        
        .btn { width: 100%; padding: 10px; background: #f57c00; color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 14px; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #e65100; }
        
        .login-links { text-align: center; margin-top: 20px; font-size: 12px; }
        .login-links a { color: #0000ff; text-decoration: underline; margin: 0 5px; }
        
        .alert { padding: 10px; border-radius: 3px; margin-bottom: 15px; font-size: 12px; }
        .alert-error { background: #f8d7da; border: 1px solid #f44336; color: #721c24; }
        .alert-success { background: #d4edda; border: 1px solid #4caf50; color: #155724; }
        
        .footer { background: #4682b4; color: #fff; padding: 10px; text-align: center; font-size: 11px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="logo">
            <div class="logo-icon">⚖️</div>
            <span>TheFinalVerdict</span>
        </a>
        <div class="header-right">
            <a href="register.html">Registrati</a>
        </div>
    </div>

    <div class="login-container">
        <div class="login-box">
            <h2>Accedi al Tuo Aldilà</h2>
            <div id="alertBox"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="email" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="password" required>
                </div>
                <div class="form-group" style="display:flex; align-items:center; gap:5px;">
                    <input type="checkbox" id="remember">
                    <label for="remember" style="font-size:12px;">Ricordami</label>
                </div>
                <button type="submit" class="btn">Accedi</button>
            </form>
            <div class="login-links">
                <a href="forgot-password.html">Password dimenticata?</a> |
                <a href="register.html">Crea un account</a>
            </div>
        </div>
    </div>

    <div class="footer">TheFinalVerdict © 2026</div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');
            
            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('accessToken', data.accessToken);
                    localStorage.setItem('refreshToken', data.refreshToken);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    alertBox.innerHTML = '<div class="alert alert-success">Login effettuato! Reindirizzamento...</div>';
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } else {
                    alertBox.innerHTML = `<div class="alert alert-error">${data.error || 'Credenziali non valide'}</div>`;
                }
            } catch (error) {
                alertBox.innerHTML = '<div class="alert alert-error">Errore di connessione</div>';
            }
        });
    </script>
</body>
</html>
