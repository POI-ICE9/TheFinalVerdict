<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheFinalVerdict - Registrati</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; background: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; }
        
        .header { background: linear-gradient(to bottom, #ffa726 0%, #fb8c00 100%); border-bottom: 3px solid #f57c00; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: bold; color: #fff; text-decoration: none; }
        .logo-icon { width: 30px; height: 30px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .header-right a { color: #fff; text-decoration: none; padding: 4px 15px; background: rgba(255,255,255,0.2); border-radius: 3px; }
        
        .register-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .register-box { background: #fff; border: 1px solid #d3d3d3; border-radius: 3px; padding: 30px; width: 100%; max-width: 450px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .register-box h2 { color: #e65100; margin-bottom: 20px; text-align: center; font-size: 22px; }
        
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; font-size: 12px; }
        .form-input { width: 100%; padding: 8px 12px; border: 1px solid #999; border-radius: 3px; font-size: 13px; font-family: Arial, sans-serif; }
        .form-input:focus { outline: none; border-color: #f57c00; }
        .form-hint { font-size: 11px; color: #666; margin-top: 3px; }
        
        .btn { width: 100%; padding: 10px; background: #f57c00; color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 14px; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #e65100; }
        
        .login-links { text-align: center; margin-top: 20px; font-size: 12px; }
        .login-links a { color: #0000ff; text-decoration: underline; }
        
        .alert { padding: 10px; border-radius: 3px; margin-bottom: 15px; font-size: 12px; }
        .alert-error { background: #f8d7da; border: 1px solid #f44336; color: #721c24; }
        .alert-success { background: #d4edda; border: 1px solid #4caf50; color: #155724; }
        
        .password-strength { height: 4px; background: #e0e0e0; border-radius: 2px; margin-top: 5px; overflow: hidden; }
        .password-strength-bar { height: 100%; width: 0; transition: all 0.3s; }
        
        .footer { background: #4682b4; color: #fff; padding: 10px; text-align: center; font-size: 11px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="logo">
            <div class="logo-icon">⚖️</div>
            <span>TheFinalVerdict</span>
        </a>
        <div class="header-right"><a href="login.html">Accedi</a></div>
    </div>

    <div class="register-container">
        <div class="register-box">
            <h2>Crea il Tuo Account</h2>
            <div id="alertBox"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">Username *</label>
                    <input type="text" class="form-input" id="username" required minlength="3" maxlength="50" pattern="[a-zA-Z0-9_]+">
                    <div class="form-hint">Solo lettere, numeri e underscore</div>
                </div>
                <div class="form-group">
                    <label class="form-label">Email *</label>
                    <input type="email" class="form-input" id="email" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input type="password" class="form-input" id="password" required minlength="8">
                    <div class="password-strength"><div class="password-strength-bar" id="strengthBar"></div></div>
                    <div class="form-hint">Minimo 8 caratteri</div>
                </div>
                <div class="form-group">
                    <label class="form-label">Conferma Password *</label>
                    <input type="password" class="form-input" id="confirmPassword" required>
                </div>
                <div class="form-group" style="display:flex; align-items:flex-start; gap:5px;">
                    <input type="checkbox" id="terms" required style="margin-top:3px;">
                    <label for="terms" style="font-size:12px;">Accetto i <a href="#" style="color:#0000ff;">Termini di Servizio</a> e la <a href="#" style="color:#0000ff;">Privacy Policy</a></label>
                </div>
                <button type="submit" class="btn">Registrati</button>
            </form>
            <div class="login-links">
                Hai già un account? <a href="login.html">Accedi</a>
            </div>
        </div>
    </div>

    <div class="footer">TheFinalVerdict © 2026</div>

    <script>
        document.getElementById('password').addEventListener('input', (e) => {
            const password = e.target.value;
            const bar = document.getElementById('strengthBar');
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^A-Za-z0-9]/)) strength++;
            const width = (strength / 4) * 100;
            bar.style.width = width + '%';
            bar.style.background = strength < 2 ? '#f44336' : strength < 3 ? '#ff9800' : '#4caf50';
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alertBox = document.getElementById('alertBox');

            if (password !== confirmPassword) {
                alertBox.innerHTML = '<div class="alert alert-error">Le password non coincidono</div>';
                return;
            }

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('accessToken', data.accessToken);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    alertBox.innerHTML = '<div class="alert alert-success">Registrazione completata! Reindirizzamento...</div>';
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } else {
                    alertBox.innerHTML = `<div class="alert alert-error">${data.error || 'Errore nella registrazione'}</div>`;
                }
            } catch (error) {
                alertBox.innerHTML = '<div class="alert alert-error">Errore di connessione</div>';
            }
        });
    </script>
</body>
</html>
