<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheFinalVerdict - Valuta Ticket</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; background: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; }
        
        .header { background: linear-gradient(to bottom, #ffa726 0%, #fb8c00 100%); border-bottom: 3px solid #f57c00; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: bold; color: #fff; text-decoration: none; }
        .logo-icon { width: 30px; height: 30px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        
        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .rating-box { background: #fff; border: 1px solid #d3d3d3; border-radius: 3px; padding: 40px; max-width: 500px; width: 100%; text-align: center; }
        .rating-box h2 { color: #e65100; margin-bottom: 10px; }
        .rating-box p { color: #666; margin-bottom: 30px; }
        
        .stars { font-size: 48px; margin-bottom: 20px; }
        .star { color: #ddd; cursor: pointer; transition: color 0.2s; }
        .star:hover, .star.active { color: #ffd700; }
        
        .form-textarea { width: 100%; padding: 10px; border: 1px solid #999; border-radius: 3px; font-size: 13px; font-family: Arial, sans-serif; min-height: 100px; resize: vertical; margin-bottom: 20px; }
        .form-textarea:focus { outline: none; border-color: #f57c00; }
        
        .btn { padding: 10px 30px; border: 1px solid #999; background: #e0e0e0; cursor: pointer; font-size: 13px; border-radius: 2px; }
        .btn-primary { background: #f57c00; color: #fff; border-color: #e65100; font-weight: bold; }
        .btn-primary:hover { background: #e65100; }
        
        .alert { padding: 10px; border-radius: 3px; margin-bottom: 15px; font-size: 12px; }
        .alert-success { background: #d4edda; border: 1px solid #4caf50; color: #155724; }
        
        .footer { background: #4682b4; color: #fff; padding: 10px; text-align: center; font-size: 11px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="../dashboard.html" class="logo">
            <div class="logo-icon">⚖️</div>
            <span>TheFinalVerdict</span>
        </a>
    </div>

    <div class="container">
        <div class="rating-box">
            <h2>⭐ Valuta il Supporto</h2>
            <p>Come valuti la qualità del supporto ricevuto per il ticket #<span id="ticketNumber">?</span>?</p>
            <div id="alertBox"></div>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <textarea class="form-textarea" id="comment" placeholder="Commento opzionale..."></textarea>
            <button class="btn btn-primary" onclick="submitRating()">Invia Valutazione</button>
        </div>
    </div>

    <div class="footer">TheFinalVerdict © 2026</div>

    <script>
        const token = localStorage.getItem('accessToken');
        if (!token) window.location.href = '../login.html';

        const params = new URLSearchParams(window.location.search);
        const ticketId = params.get('id');
        let currentRating = 0;

        document.getElementById('ticketNumber').textContent = ticketId;

        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', () => {
                currentRating = parseInt(star.dataset.value);
                document.querySelectorAll('.star').forEach((s, i) => {
                    s.classList.toggle('active', i < currentRating);
                });
            });
            star.addEventListener('mouseenter', () => {
                const val = parseInt(star.dataset.value);
                document.querySelectorAll('.star').forEach((s, i) => {
                    s.style.color = i < val ? '#ffd700' : '#ddd';
                });
            });
        });

        document.getElementById('stars').addEventListener('mouseleave', () => {
            document.querySelectorAll('.star').forEach((s, i) => {
                s.style.color = i < currentRating ? '#ffd700' : '#ddd';
            });
        });

        async function submitRating() {
            if (currentRating === 0) { alert('Seleziona almeno una stella'); return; }
            
            try {
                const response = await fetch(`/api/v1/tickets/${ticketId}/rate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ rating: currentRating, rating_comment: document.getElementById('comment').value })
                });

                if (response.ok) {
                    document.getElementById('alertBox').innerHTML = '<div class="alert alert-success">Grazie per la tua valutazione!</div>';
                    setTimeout(() => window.location.href = 'tickets-list.html', 2000);
                } else {
                    alert('Errore');
                }
            } catch (error) { alert('Errore di connessione'); }
        }
    </script>
</body>
</html>
