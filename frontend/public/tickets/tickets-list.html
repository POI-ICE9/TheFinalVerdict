<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheFinalVerdict - I Miei Ticket</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; background: #f5f5f5; }
        
        .header { background: linear-gradient(to bottom, #ffa726 0%, #fb8c00 100%); border-bottom: 3px solid #f57c00; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: bold; color: #fff; text-decoration: none; }
        .logo-icon { width: 30px; height: 30px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .header-right a { color: #fff; text-decoration: none; padding: 4px 12px; background: rgba(255,255,255,0.2); border-radius: 3px; margin-left: 10px; font-size: 12px; }
        
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        
        .page-header { background: #fff; border: 1px solid #d3d3d3; padding: 15px 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-radius: 3px; }
        .page-title { font-size: 18px; color: #333; font-weight: bold; }
        
        .btn { padding: 6px 12px; border: 1px solid #999; background: #e0e0e0; cursor: pointer; font-size: 12px; border-radius: 2px; text-decoration: none; display: inline-block; }
        .btn:hover { background: #d0d0d0; }
        .btn-primary { background: #f57c00; color: #fff; border-color: #e65100; }
        .btn-primary:hover { background: #e65100; }
        
        .filters { background: #fff; border: 1px solid #d3d3d3; padding: 15px; margin-bottom: 20px; border-radius: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
        .filters select, .filters input { padding: 6px 10px; border: 1px solid #999; border-radius: 3px; font-size: 12px; font-family: Arial, sans-serif; }
        
        .ticket-list { background: #fff; border: 1px solid #d3d3d3; border-radius: 3px; overflow: hidden; }
        .ticket-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .ticket-item:hover { background: #fff3e0; }
        .ticket-info h4 { color: #333; margin-bottom: 5px; }
        .ticket-info h4 a { color: #0000ff; text-decoration: none; }
        .ticket-meta { font-size: 11px; color: #666; }
        .ticket-status { padding: 4px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        .status-open { background: #bbdefb; color: #1565c0; }
        .status-in_progress { background: #ffe0b2; color: #ef6c00; }
        .status-resolved { background: #c8e6c9; color: #2e7d32; }
        .status-closed { background: #e0e0e0; color: #616161; }
        
        .footer { background: #4682b4; color: #fff; padding: 10px; text-align: center; font-size: 11px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="../dashboard.html" class="logo">
            <div class="logo-icon">⚖️</div>
            <span>TheFinalVerdict</span>
        </a>
        <div class="header-right">
            <a href="../dashboard.html">Dashboard</a>
            <a href="../profile.html">Profilo</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <div class="page-title">🎫 I Miei Ticket di Supporto</div>
            <a href="ticket-create.html" class="btn btn-primary">+ Nuovo Ticket</a>
        </div>

        <div class="filters">
            <select id="filterStatus">
                <option value="">Tutti gli stati</option>
                <option value="open">Aperto</option>
                <option value="in_progress">In Lavorazione</option>
                <option value="resolved">Risolto</option>
                <option value="closed">Chiuso</option>
            </select>
            <button class="btn btn-primary" onclick="loadTickets()">Filtra</button>
        </div>

        <div class="ticket-list" id="ticketList">
            <div style="padding:40px; text-align:center; color:#666;">Caricamento...</div>
        </div>
    </div>

    <div class="footer">TheFinalVerdict © 2026</div>

    <script>
        const token = localStorage.getItem('accessToken');
        if (!token) window.location.href = '../login.html';

        async function loadTickets() {
            const status = document.getElementById('filterStatus').value;
            try {
                const params = status ? `?status=${status}` : '';
                const response = await fetch(`/api/v1/tickets/my${params}`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await response.json();
                const list = document.getElementById('ticketList');
                
                if (data.tickets.length === 0) {
                    list.innerHTML = '<div style="padding:40px; text-align:center; color:#666;">Nessun ticket trovato</div>';
                    return;
                }

                list.innerHTML = data.tickets.map(t => `
                    <div class="ticket-item">
                        <div class="ticket-info">
                            <h4><a href="ticket-detail.html?id=${t.id}">#${t.ticket_number} - ${t.subject}</a></h4>
                            <div class="ticket-meta">${t.category} • Creato il ${new Date(t.created_at).toLocaleDateString()} • Aggiornato ${new Date(t.updated_at).toLocaleDateString()}</div>
                        </div>
                        <span class="ticket-status status-${t.status}">${t.status}</span>
                    </div>
                `).join('');
            } catch (error) { console.error(error); }
        }

        function logout() {
            if (confirm('Sei sicuro di voler uscire?')) {
                localStorage.clear();
                window.location.href = '../login.html';
            }
        }

        loadTickets();
    </script>
</body>
</html>
