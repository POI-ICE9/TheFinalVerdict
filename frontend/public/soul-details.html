<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheFinalVerdict - Dettaglio Anima</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; background: #f5f5f5; }
        
        .header { background: linear-gradient(to bottom, #ffa726 0%, #fb8c00 100%); border-bottom: 3px solid #f57c00; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: bold; color: #fff; text-decoration: none; }
        .logo-icon { width: 30px; height: 30px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .header-right a { color: #fff; text-decoration: none; padding: 4px 12px; background: rgba(255,255,255,0.2); border-radius: 3px; margin-left: 10px; font-size: 12px; }
        
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        
        .soul-header { background: #fff; border: 1px solid #d3d3d3; border-radius: 3px; padding: 30px; margin-bottom: 20px; text-align: center; }
        .soul-header h1 { color: #e65100; font-size: 32px; margin-bottom: 10px; }
        .soul-meta { color: #666; font-size: 13px; margin-bottom: 20px; }
        .soul-bio { color: #333; line-height: 1.6; max-width: 700px; margin: 0 auto; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: #fff; border: 1px solid #d3d3d3; padding: 20px; text-align: center; border-radius: 3px; }
        .stat-box.inferno { border-top: 4px solid #d32f2f; }
        .stat-box.purgatorio { border-top: 4px solid #f57c00; }
        .stat-box.paradiso { border-top: 4px solid #fbc02d; }
        .stat-value { font-size: 32px; font-weight: bold; }
        .stat-label { font-size: 12px; color: #666; text-transform: uppercase; margin-top: 5px; }
        
        .section { background: #fff; border: 1px solid #d3d3d3; border-radius: 3px; padding: 20px; margin-bottom: 20px; }
        .section h3 { color: #e65100; margin-bottom: 15px; font-size: 16px; border-bottom: 2px solid #f57c00; padding-bottom: 8px; }
        
        .judgment-item { padding: 15px; border-bottom: 1px solid #eee; }
        .judgment-item:last-child { border-bottom: none; }
        .judgment-user { font-weight: bold; color: #333; }
        .judgment-realm { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 10px; }
        .judgment-realm.inferno { background: #ffcdd2; color: #c62828; }
        .judgment-realm.purgatorio { background: #ffe0b2; color: #ef6c00; }
        .judgment-realm.paradiso { background: #fff9c4; color: #f57f17; }
        .judgment-motivation { color: #555; margin-top: 8px; font-style: italic; line-height: 1.5; }
        .judgment-punishment { background: #f5f5f5; padding: 10px; border-left: 3px solid #f57c00; margin-top: 10px; font-size: 12px; }
        
        .btn { padding: 8px 16px; border: 1px solid #999; background: #e0e0e0; cursor: pointer; font-size: 12px; border-radius: 2px; }
        .btn:hover { background: #d0d0d0; }
        .btn-primary { background: #f57c00; color: #fff; border-color: #e65100; }
        .btn-primary:hover { background: #e65100; }
        .btn-large { padding: 12px 30px; font-size: 14px; font-weight: bold; }
        
        .footer { background: #4682b4; color: #fff; padding: 10px; text-align: center; font-size: 11px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="dashboard.html" class="logo">
            <div class="logo-icon">⚖️</div>
            <span>TheFinalVerdict</span>
        </a>
        <div class="header-right">
            <a href="dashboard.html">Dashboard</a>
            <a href="search.html">Cerca</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="soul-header">
            <h1 id="soulName">Caricamento...</h1>
            <div class="soul-meta" id="soulMeta"></div>
            <div class="soul-bio" id="soulBio"></div>
            <div style="margin-top:20px;">
                <button class="btn btn-primary btn-large" onclick="judgeThisSoul()">⚖️ Giudica Questa Anima</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box inferno">
                <div class="stat-value" id="infernoCount">0</div>
                <div class="stat-label">🔥 Inferno</div>
            </div>
            <div class="stat-box purgatorio">
                <div class="stat-value" id="purgatorioCount">0</div>
                <div class="stat-label">⛰️ Purgatorio</div>
            </div>
            <div class="stat-box paradiso">
                <div class="stat-value" id="paradisoCount">0</div>
                <div class="stat-label">✨ Paradiso</div>
            </div>
        </div>

        <div class="section">
            <h3>📜 Sentenze della Community</h3>
            <div id="judgmentsList">Caricamento...</div>
        </div>
    </div>

    <div class="footer">TheFinalVerdict © 2026</div>

    <script>
        const token = localStorage.getItem('accessToken');
        if (!token) window.location.href = 'login.html';

        const params = new URLSearchParams(window.location.search);
        const soulId = params.get('id');

        async function loadSoul() {
            try {
                const response = await fetch(`/api/v1/souls/${soulId}`);
                const data = await response.json();
                const s = data.soul;
                
                document.getElementById('soulName').textContent = s.name;
                document.getElementById('soulMeta').textContent = `${s.category} • ${s.epoch || 'Epoca sconosciuta'} • ${s.nationality || 'Nazionalità sconosciuta'}`;
                document.getElementById('soulBio').textContent = s.biography || 'Nessuna biografia disponibile.';
                document.getElementById('infernoCount').textContent = s.inferno_count;
                document.getElementById('purgatorioCount').textContent = s.purgatorio_count;
                document.getElementById('paradisoCount').textContent = s.paradiso_count;

                const judgments = s.userSouls || [];
                const list = document.getElementById('judgmentsList');
                
                if (judgments.length === 0) {
                    list.innerHTML = '<div style="padding:20px; text-align:center; color:#666;">Nessuna sentenza ancora. Sii il primo a giudicare!</div>';
                    return;
                }

                list.innerHTML = judgments.slice(0, 20).map(j => `
                    <div class="judgment-item">
                        <div>
                            <span class="judgment-user">${j.user?.username || 'Anonimo'}</span>
                            <span class="judgment-realm ${j.realm?.realm_type}">${j.realm?.realm_type === 'inferno' ? '🔥 Inferno' : j.realm?.realm_type === 'purgatorio' ? '⛰️ Purgatorio' : '✨ Paradiso'}</span>
                        </div>
                        <div class="judgment-motivation">"${j.motivation}"</div>
                        ${j.punishment ? `<div class="judgment-punishment"><strong>Pena/Beatitudine:</strong> ${j.punishment}</div>` : ''}
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('soulName').textContent = 'Errore di caricamento';
            }
        }

        function judgeThisSoul() {
            window.location.href = `dashboard.html?judge=${soulId}`;
        }

        function logout() {
            if (confirm('Sei sicuro di voler uscire?')) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }

        loadSoul();
    </script>
</body>
</html>
